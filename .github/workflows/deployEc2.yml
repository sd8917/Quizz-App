## Write script to deploy to EC2 instance
name: Deploy to EC2
on:
  push:
    branches:
      - main
jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY_BACKEND }}
          remote-user: ubuntu
          server-ip: ${{ secrets.EC2_SERVER_IP_BACKEND }}
          remote-path: /home/ubuntu/quizz-app
          local-path: ./dist
          pre-deploy-command: |
            pm2 stop all || true
          post-deploy-command: |
            pm2 start all || pm2 start npm --name "quizz-app" -- start