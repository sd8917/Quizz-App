## Write script to deploy to EC2 instance
name: Deploy to EC2
on:
  push:
    branches:
      - main
jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      # - name: Generate Release Tag
      #   id: tag
      #   run: |
      #     TAG="v$(date +'%Y.%m.%d')-${{ github.run_number }}"
      #     echo "tag=$TAG" >> $GITHUB_OUTPUT
      #     echo "Generated tag: $TAG"

      # - name: Create Release Notes
      #   id: notes
      #   run: |
      #     cat > release_notes.md << 'EOF'
      #     ## 🚀 Deployment Release
          
      #     **Deployed to:** Production EC2
      #     **Commit:** ${{ github.sha }}
      #     **Branch:** ${{ github.ref_name }}
      #     **Triggered by:** ${{ github.actor }}
      #     **Build:** #${{ github.run_number }}
          
      #     ### 📝 Recent Changes
      #     ${{ github.event.head_commit.message }}
          
      #     ### 🔗 Links
      #     - [View Commit](${{ github.event.head_commit.url }})
      #     - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
      #     EOF
      #     echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      # - name: Create GitHub Release
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     tag_name: ${{ steps.tag.outputs.tag }}
      #     name: Release ${{ steps.tag.outputs.tag }}
      #     body_path: release_notes.md
      #     draft: false
      #     prerelease: false
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.TOKEN_SECRET_GITHUB }}

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          
          # Copy built files
          cp -r dist deploy-package/
          
          # Copy configuration files
          cp package*.json deploy-package/
          cp tsconfig.json deploy-package/
          cp jest.config.js deploy-package/ 2>/dev/null || true
          
          # Copy logs directory structure
          mkdir -p deploy-package/logs
          
          echo "=== Deployment Package Contents ==="
          ls -la deploy-package/
          echo "=== Dist Directory ==="
          ls -la deploy-package/dist/

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY_BACKEND }}
          REMOTE_USER: ubuntu
          REMOTE_HOST: ${{ secrets.EC2_SERVER_IP_BACKEND }}
          TARGET: /home/ubuntu/Quizz-App
          SOURCE: deploy-package/
          EXCLUDE: /node_modules/, /.git/, /.github/, /src/, *.md, /logs/*.log
          SCRIPT_BEFORE: |
            pm2 stop Quiz-App || true
            mkdir -p /home/ubuntu/Quizz-App/logs
          SCRIPT_AFTER: |
            cd /home/ubuntu/Quizz-App
            echo "=== Verifying deployment structure ==="
            ls -la
            echo "=== Checking dist directory ==="
            ls -la dist/
            echo "=== Installing production dependencies ==="
            npm ci --production --prefer-offline
            echo "=== Starting application with PM2 ==="
            pm2 delete Quiz-App || true
            pm2 start dist/index.js --name="Quiz-App" --node-args="--max-old-space-size=4096"
            pm2 save
            echo "=== PM2 Process List ==="
            pm2 list
            sleep 2
            echo "=== Application logs (last 15 lines) ==="
            pm2 logs Quiz-App --lines 15 --nostream || true