## Write script to deploy to EC2 instance
name: Deploy to EC2
on:
  push:
    branches:
      - main
jobs:

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run build

      - name: Generate Release Tag
        id: tag
        run: |
          TAG="v$(date +'%Y.%m.%d')-${{ github.run_number }}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Generated tag: $TAG"

      - name: Create Release Notes
        id: notes
        run: |
          cat > release_notes.md << 'EOF'
          ## 🚀 Deployment Release
          
          **Deployed to:** Production EC2
          **Commit:** ${{ github.sha }}
          **Branch:** ${{ github.ref_name }}
          **Triggered by:** ${{ github.actor }}
          **Build:** #${{ github.run_number }}
          
          ### 📝 Recent Changes
          ${{ github.event.head_commit.message }}
          
          ### 🔗 Links
          - [View Commit](${{ github.event.head_commit.url }})
          - [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF
          echo "notes_file=release_notes.md" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Release ${{ steps.tag.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.TOKEN_SECRET_GITHUB }}

      - name: Prepare deployment package
        run: |
          mkdir -p deploy-package
          cp -r dist/* deploy-package/
          cp package*.json deploy-package/
          echo "Deployment package created"
          ls -la deploy-package/

      - name: Deploy to EC2
        uses: easingthemes/ssh-deploy@v2.1.5
        with:
          SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_KEY_BACKEND }}
          REMOTE_USER: ubuntu
          REMOTE_HOST: ${{ secrets.EC2_SERVER_IP_BACKEND }}
          TARGET: /home/ubuntu/Quizz-App
          SOURCE: deploy-package/
          EXCLUDE: /node_modules/, /.git/, /.github/
          SCRIPT_BEFORE: |
            pm2 stop Quizz-App || true
            mkdir -p /home/ubuntu/Quizz-App/logs
          SCRIPT_AFTER: |
            cd /home/ubuntu/Quizz-App
            npm install --production --omit=dev
            pm2 restart Quizz-App || pm2 start index.js --name "Quizz-App" -i max --node-args="--max-old-space-size=4096"
            pm2 save